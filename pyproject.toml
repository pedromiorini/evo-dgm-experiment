[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-dgm-experiment"
version = "0.4.0"
description = "Sistema experimental auditável de auto-modificação evolutiva"
requires-python = ">=3.12"
readme = "README.md"

[project.optional-dependencies]
dev = [
  "pytest",
  "pyyaml",
  "httpx",
  "docker",
]

[project.scripts]
evo-kernel = "evo_kernel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
